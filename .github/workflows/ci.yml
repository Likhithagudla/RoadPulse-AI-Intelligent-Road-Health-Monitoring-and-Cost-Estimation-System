name: RoadPulse CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality-and-security:
    name: Code Quality, Linting & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install QA & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black bandit pip-audit

      - name: 1. Python Syntax & Compilation Verification
        run: |
          echo "[INFO] Verifying Python bytecode compilation across all modules..."
          python -m compileall -q backend ai_models

      - name: 2. Python Static Analysis & Linting (Flake8)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend/app ai_models/modules --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning check for complexity and conventions
          flake8 backend/app ai_models/modules --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: 3. Code Formatting Check (Black)
        run: |
          black --check --diff backend/app/core backend/app/models backend/app/schemas || true

      - name: 4. Static Application Security Testing (Bandit)
        run: |
          echo "[INFO] Running Bandit AST security vulnerability scanner..."
          bandit -r backend/app -ll -ii -x "backend/app/tests" || true

      - name: 5. Dependency Vulnerability Audit (pip-audit)
        run: |
          echo "[INFO] Auditing dependencies for known CVE vulnerabilities..."
          pip-audit -r backend/requirements.txt || true

  backend-test-suite:
    name: Pytest Automated Verification (Unit, API, Security, ML)
    runs-on: ubuntu-latest
    needs: [code-quality-and-security]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linux System Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 curl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full Pytest Suite (57 Tests)
        env:
          SECRET_KEY: test_secret_key_for_github_actions_ci_pipeline_only_0123456789
          ENVIRONMENT: test
          DATABASE_URL: sqlite:///:memory:
        run: |
          python -m pytest backend/app/tests -v --durations=10

  docker-container-build:
    name: Multi-Stage Docker Container Build
    runs-on: ubuntu-latest
    needs: [backend-test-suite]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build and Validate Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: roadpulse:ci-test
